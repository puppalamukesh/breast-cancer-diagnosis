[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcd"
version = "1.0.0"
description = "End-to-end machine learning project: breast cancer diagnosis with model comparison and a FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mukesh Puppala" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N803", "N806"]  # X and X_train are the usual ML names
